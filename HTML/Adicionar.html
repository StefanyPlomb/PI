<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adicionar Protocolo</title>
  <link rel="stylesheet" href="../CSS/Adicionar.css" />
</head>
<body>
  <main class="adicionar">
    <div class="conteudo">
      <span id="fechar">&times;</span>

      <div class="conteudo-interno">
        <!-- LADO ESQUERDO: FORMULÁRIO -->
        <div class="modal-left">
          <h2>Novo Protocolo</h2>
          <form id="form-protocolo">
            <label>Nome do Protocolo:</label>
            <input type="text" id="nomeProtocolo" placeholder="Ex: Revisão de Estoque 2025" required />

            <label>Data de Criação:</label>
            <input type="date" id="dataCriacao" required />

            <label>Data de Finalização:</label>
            <input type="date" id="dataFinal" />

            <label>Solicitante:</label>
            <input type="text" id="solicitante" placeholder="Ex: Equipe de Desenvolvimento" required />

            <label>Breve Descrição:</label>
            <textarea id="descricao" class="caixa-textarea" placeholder="Explique o objetivo ou contexto deste protocolo..." required></textarea>

            <button type="submit" class="button-tarefa">Salvar Protocolo</button>
          </form>
        </div>

        <!-- LADO DIREITO: INFORMAÇÕES GERADAS -->
        <div class="modal-right">
          <div class="info-text">
            <h3>Informações do Protocolo</h3>
            <p><strong>Solicitante:</strong> <span id="infoSolicitante">—</span></p>
            <p><strong>Data de criação:</strong> <span id="infoCriacao">—</span></p>
            <p><strong>Data final:</strong> <span id="infoFinal">—</span></p>
            <p><strong>Última atualização:</strong> <span id="infoAtualizacao">—</span></p>
            <p><strong>Status:</strong> <span id="infoStatus">Em andamento</span></p>
          </div>
          <button class="button-tarefa atualizar" id="btnAtualizar">Adicionar Conversa</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Exemplo de exibição dinâmica
    document.getElementById('form-protocolo').addEventListener('submit', function(e) {
      e.preventDefault();

      document.getElementById('infoSolicitante').textContent = document.getElementById('solicitante').value;
      document.getElementById('infoCriacao').textContent = document.getElementById('dataCriacao').value;
      document.getElementById('infoFinal').textContent = document.getElementById('dataFinal').value || '—';
      document.getElementById('infoAtualizacao').textContent = new Date().toLocaleString();

      alert('✅ Protocolo salvo com sucesso!');
    });
  </script>
</body>
</html>
